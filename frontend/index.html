<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小玉</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section id="auth-panel" class="auth-panel" aria-label="登录">
      <h1>登录小玉</h1>
      <input id="auth-username" type="text" minlength="3" maxlength="64" placeholder="用户名" autocomplete="username" />
      <input id="auth-password" type="password" minlength="8" maxlength="256" placeholder="密码" autocomplete="current-password" />
      <div class="auth-actions">
        <button id="login-button" type="button">登录</button>
        <button id="register-button" type="button">注册</button>
      </div>
      <p id="auth-error" class="auth-error" role="alert"></p>
    </section>
    <main class="shell">
      <header class="topbar">
        <div class="identity">
          <div class="avatar" aria-hidden="true">玉</div>
          <div>
            <h1>小玉</h1>
            <p><span class="status-dot"></span>在线陪伴中</p>
          </div>
        </div>
        <div class="top-actions">
          <span id="connection-status" class="connection-status" data-state="ready">就绪</span>
          <select id="conversation-select" aria-label="选择会话" title="选择会话"></select>
          <input id="conversation-title" class="conversation-title" type="text" maxlength="120" placeholder="会话名称" aria-label="会话名称" />
          <button id="conversation-title-save" class="icon-button" type="button" aria-label="保存会话名称" title="保存会话名称">✓</button>
          <button id="new-conversation-button" class="icon-button" type="button" aria-label="新建会话" title="新建会话">＋</button>
          <button id="delete-conversation-button" class="icon-button" type="button" aria-label="删除聊天记录" title="删除聊天记录">×</button>
          <button id="forget-conversation-button" class="icon-button danger-button" type="button" aria-label="删除并遗忘" title="删除并遗忘">!</button>
          <button id="memory-button" class="icon-button" type="button" aria-label="管理长期记忆" title="管理长期记忆">◇</button>
          <select id="persona-select" aria-label="选择人格模板" title="选择人格模板"></select>
          <input id="persona-nickname" class="persona-nickname" type="text" maxlength="80" placeholder="称呼" aria-label="称呼" />
          <button id="persona-save" class="icon-button" type="button" aria-label="保存人格设置" title="保存人格设置">✓</button>
          <button id="logout-button" class="icon-button" type="button" aria-label="退出登录" title="退出登录">↪</button>
          <button id="clear-button" class="icon-button" type="button" aria-label="清空当前显示" title="清空当前显示，不删除记录">⌫</button>
          <a class="docs-link" href="/docs" target="_blank" rel="noreferrer">API 文档</a>
        </div>
      </header>

      <section class="session-persona" aria-label="当前会话人格设置">
        <div class="session-persona-heading">
          <strong>当前会话模式</strong>
          <span id="session-persona-status">跟随默认</span>
        </div>
        <div class="session-persona-fields">
          <select id="session-style" aria-label="当前会话风格" title="当前会话风格">
            <option value="">跟随默认风格</option>
            <option value="soft_milk">软萌奶糖</option>
            <option value="genki_bounce">元气跳跳</option>
            <option value="gentle_warm">温柔贴贴</option>
          </select>
          <select id="session-mode" aria-label="当前会话模式" title="当前会话模式">
            <option value="">跟随默认模式</option>
            <option value="companion">陪伴</option>
            <option value="consulting">咨询</option>
            <option value="study">学习</option>
            <option value="work">工作</option>
          </select>
          <input id="session-nickname" type="text" maxlength="80" placeholder="本会话称呼" aria-label="本会话称呼" />
          <input id="session-instructions" type="text" maxlength="2000" placeholder="本会话临时指令" aria-label="本会话临时指令" />
          <button id="session-persona-save" class="compact-button" type="button">保存</button>
          <button id="session-persona-reset" class="compact-button secondary-button" type="button">恢复默认</button>
        </div>
      </section>

      <section id="memory-panel" class="memory-panel" hidden aria-label="长期记忆管理">
        <div class="memory-panel-heading">
          <strong>长期记忆</strong>
          <button id="memory-refresh" class="compact-button secondary-button" type="button">刷新</button>
        </div>
        <div id="memory-list" class="memory-list"></div>
      </section>

      <section id="messages" class="messages" aria-live="polite" aria-label="聊天消息">
        <div class="welcome">
          <div class="welcome-mark">♡</div>
          <h2>今天想聊点什么？</h2>
          <p>把心里的话告诉我就好。</p>
        </div>
      </section>

      <form id="chat-form" class="composer">
        <textarea id="message-input" rows="1" maxlength="2000" placeholder="说点什么…" aria-label="消息内容"></textarea>
        <button id="send-button" type="submit" aria-label="发送消息">
          <span aria-hidden="true">↑</span>
        </button>
      </form>
      <p class="hint">按 Enter 发送，Shift + Enter 换行</p>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
